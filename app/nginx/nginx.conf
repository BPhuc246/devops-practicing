events {}

http {
    client_max_body_size 10M;
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name tododevops.duckdns.org;

        # Required for Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS once cert exists
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name tododevops.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/tododevops.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tododevops.duckdns.org/privkey.pem;

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /api/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /nginx-health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}



name: build-and-lint

# Trigger when this workflow run
on:
  push:
    branches: [main, dev] # push to main or dev
  pull_request:
    branches: [main, dev] # pull from main or dev

jobs:
  build-and-lint:
    runs-on: ubuntu-latest # run on VM of github

  steps:
    # Clone code to VM
    - name: Checkout repo
      uses: actions/checkout@v3

    # Install nodejs on VM
    - name: Setup repo
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Backend install dependencies
      working-directory: backend
      run: npm ci

    - name: Lint backend
      working-directory: backend
      run: npm run lint --max-warnings=0

    - name: Frontend install dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint frontend
      working-directory: frontend
      run: npm run lint --max-warnings=0

    - name: Build backend image
      run: docker build -t backend ./app/backend

    - name: Build frontend image
      run: docker build
        --build-arg VITE_BACKEND_URL=http://localhost:3001
        -t frontend ./frontend

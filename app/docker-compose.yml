services:
  database:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - pern-net

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "8080"
    networks:
      - pern-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "/api"
    container_name: frontend
    restart: always
    depends_on:
      - backend
    networks:
      - pern-net
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - pern-net
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - pern-net

volumes:
  postgres_data:

networks:
  pern-net:
    driver: bridge

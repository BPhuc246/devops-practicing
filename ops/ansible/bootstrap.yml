- name: Bootstrap VPS
  hosts: prod
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
    
    - name: Install base packages needed for Docker repo
      apt:
        name:
            - ca-certificates
            - curl
            - gnupg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    
    - name: Download Docker GPG keyrings
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true
    
    - name: Add Docker apt repository
      apt_repository:
        repo: >- 
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
    
    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: true
    
    - name: Install Docker Egngine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
    
    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Create app directory (/opt/statusboard)
      file:
        path: /opt/statusboard
        state: directory
        mode: "0755"
